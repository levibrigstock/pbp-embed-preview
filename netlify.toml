# Generated by scripts/pack-embed.sh — publish this folder as the site root.
# Full-app Netlify config lives at repo root netlify.toml.

[build]
  publish = "."
  command = "echo 'No build — PoleBarn Pro embed package'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Allow company websites to iframe the configurator.
# Tighten frame-ancestors to known customer domains once tenants exist.
[[headers]]
  for = "/public/*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/public/embed.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

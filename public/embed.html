<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Design Your Building</title>

  <!-- Local Three.js — no CDN. Paths are relative to /public/embed.html -->
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three.module.js",
        "three/addons/": "../vendor/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #0e0b12;
      --panel: #17131f;
      --panel-2: #1f1a2b;
      --line: #322b44;
      --text: #f2ecf7;
      --muted: #a99fbb;
      --accent: #7c4dff;
      --accent-ink: #fff;
      --radius: 10px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Layout: viewer + controls. Stacked on mobile, side-by-side on wide. */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .viewer {
      position: relative;
      flex: 0 0 46vh;
      min-height: 240px;
      background: #7eb4d8;
      touch-action: none; /* let OrbitControls own the gesture */
    }
    #viewport { display: block; width: 100%; height: 100%; }

    .viewer-hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 5px 9px;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 6px;
      pointer-events: none;
    }

    .controls {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 28px;
    }

    @media (min-width: 900px) {
      .app { flex-direction: row; }
      .viewer { flex: 1 1 auto; height: 100%; }
      .controls {
        flex: 0 0 380px;
        border-left: 1px solid var(--line);
        height: 100%;
      }
    }

    h1 {
      font-size: 17px;
      margin: 2px 0 14px;
      letter-spacing: 0.2px;
    }
    h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin: 18px 0 8px;
    }

    fieldset {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px 12px;
      margin: 0 0 10px;
      background: var(--panel);
    }
    legend { padding: 0 6px; color: var(--muted); font-size: 12px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      margin-bottom: 8px;
    }
    .row.one { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field.full { grid-column: 1 / -1; }

    label { font-size: 12px; color: var(--muted); }

    input[type="number"],
    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select {
      width: 100%;
      padding: 8px 9px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      min-height: 40px; /* comfortable tap target */
    }

    .inline { display: flex; align-items: center; gap: 8px; }
    .inline input[type="checkbox"] { width: 20px; height: 20px; }

    .swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid #0006;
      vertical-align: -3px;
      margin-right: 6px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 12px;
      min-height: 40px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      width: 100%;
      margin-top: 6px;
    }
    button.small { padding: 6px 9px; min-height: 34px; font-size: 13px; }
    button.link {
      background: none;
      border: none;
      color: var(--accent);
      padding: 4px 0;
      min-height: 0;
    }

    .list-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: var(--panel-2);
    }
    .list-item .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .list-item .list-head strong { font-size: 13px; }

    .add-btn { width: 100%; margin-top: 2px; }

    .warnings {
      color: #ffcf7a;
      font-size: 12px;
      margin: 6px 0 0;
      white-space: pre-wrap;
    }

    /* Request-quote dialog */
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      padding: 0;
      width: min(440px, 92vw);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    .dialog-body { padding: 18px; }
    .dialog-body h3 { margin: 0 0 4px; }
    .dialog-body p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 6px; }
    .dialog-actions button { flex: 1; }

    .sent-ok {
      color: #8fe3a6;
      font-size: 13px;
      margin-top: 10px;
    }

    .foot {
      color: var(--muted);
      font-size: 11px;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="viewer">
      <canvas id="viewport"></canvas>
      <div class="viewer-hint">Drag to rotate · pinch / scroll to zoom</div>
    </div>

    <form class="controls" id="cfgForm" autocomplete="off">
      <h1 id="title">Design Your Building</h1>

      <fieldset>
        <legend>Building</legend>
        <div class="row">
          <div class="field">
            <label for="width">Width (ft)</label>
            <input type="number" id="width" min="12" max="100" step="1" />
          </div>
          <div class="field">
            <label for="length">Length (ft)</label>
            <input type="number" id="length" min="12" max="300" step="1" />
          </div>
          <div class="field">
            <label for="eaveHeight">Eave height (ft)</label>
            <input type="number" id="eaveHeight" min="8" max="20" step="1" />
          </div>
          <div class="field">
            <label for="pitch">Roof pitch (x/12)</label>
            <input type="number" id="pitch" min="1" max="12" step="0.5" />
          </div>
          <div class="field full">
            <label for="roofStyle">Roof style</label>
            <select id="roofStyle">
              <option value="gable">Gable</option>
              <option value="mono">Mono slope</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Colors</legend>
        <div class="row">
          <div class="field">
            <label for="wallColor">Walls</label>
            <select id="wallColor" data-color></select>
          </div>
          <div class="field">
            <label for="roofColor">Roof</label>
            <select id="roofColor" data-color></select>
          </div>
          <div class="field">
            <label for="trimColor">Trim</label>
            <select id="trimColor" data-color></select>
          </div>
          <div class="field">
            <label for="wainscotColor">Wainscot</label>
            <select id="wainscotColor" data-color></select>
          </div>
          <div class="field" id="wainscotHeightWrap" hidden>
            <label for="wainscotHeight">Wainscot height (ft)</label>
            <input type="number" id="wainscotHeight" min="1" max="6" step="0.5" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Metal</legend>
        <div class="row one">
          <div class="field">
            <label for="metalGauge">Panel gauge</label>
            <select id="metalGauge">
              <option value="29">29 gauge (standard)</option>
              <option value="26">26 gauge (heavier)</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Concrete slab</legend>
        <div class="row">
          <div class="field full inline">
            <input type="checkbox" id="concreteEnabled" />
            <label for="concreteEnabled" style="font-size:14px;color:var(--text)">Include a concrete slab</label>
          </div>
          <div class="field" id="concreteThickWrap" hidden>
            <label for="concreteThickness">Thickness (in)</label>
            <input type="number" id="concreteThickness" min="3" max="8" step="0.5" />
          </div>
        </div>
      </fieldset>

      <h2>Lean-tos</h2>
      <div id="leanList"></div>
      <button type="button" class="small add-btn" id="addLean">+ Add lean-to</button>

      <h2>Openings</h2>
      <div id="openingList"></div>
      <button type="button" class="small add-btn" id="addOpening">+ Add window / door</button>

      <p class="warnings" id="warnings" hidden></p>

      <button type="button" class="primary" id="requestQuoteBtn">Request a quote</button>

      <p class="foot" id="companyFoot"></p>
    </form>
  </div>

  <dialog id="quoteDialog">
    <form method="dialog" class="dialog-body" id="quoteForm">
      <h3>Request a quote</h3>
      <p class="sub">We'll send you pricing for the building you designed. No obligation.</p>
      <div class="row one">
        <div class="field">
          <label for="leadName">Name</label>
          <input type="text" id="leadName" required />
        </div>
        <div class="field">
          <label for="leadPhone">Phone</label>
          <input type="tel" id="leadPhone" required />
        </div>
        <div class="field">
          <label for="leadEmail">Email</label>
          <input type="email" id="leadEmail" required />
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="small" id="quoteCancel">Cancel</button>
        <button type="submit" class="primary" style="margin-top:0" id="quoteSubmit">Send</button>
      </div>
      <p class="sent-ok" id="quoteSent" hidden>Thanks — your request has been recorded.</p>
    </form>
  </dialog>

  <script type="module" src="../js/public/embedApp.js"></script>
</body>
</html>
